<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f2945"><title>Андрей ♥ Лиза — наша история</title>
<style>
:root{font-family:Georgia,'Times New Roman',serif;color:#552b3d;background:#f9f0eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#fff7e9 0,transparent 45%),radial-gradient(ellipse at 90% 80%,#f2d5d9 0,transparent 50%),#f9f0eb;display:grid;place-items:center;padding:25px 14px}.card{position:relative;width:min(100%,670px);padding:clamp(25px,6vw,55px);border:1px solid #e4c8c9;border-radius:30px;background:#fffaf5eF;box-shadow:0 18px 70px #7d3b5020;text-align:center;overflow:hidden}.card:before,.card:after{content:'✧';position:absolute;color:#d8a3a8;font-size:35px}.card:before{top:22px;left:26px}.card:after{right:24px;bottom:18px}.eyebrow{font:12px system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#a7737d}.heart{color:#b45c78;display:inline-block;animation:pulse 2.5s infinite}@keyframes pulse{50%{transform:scale(1.16)}}h1{font-size:clamp(40px,9vw,68px);font-weight:400;margin:20px 0 8px;letter-spacing:-2px}.date{font:14px system-ui,sans-serif;color:#906b75}.line{width:75px;height:1px;background:#d8a4ac;margin:27px auto}.intro{font-size:19px;line-height:1.5}.timer{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.unit{padding:17px 4px;background:#f7e9e8;border:1px solid #ecd5d6;border-radius:16px}.num{font-size:clamp(30px,7vw,49px);font-variant-numeric:tabular-nums}.lbl{font:12px system-ui,sans-serif;color:#906c75;margin-top:5px}.small{font:14px system-ui,sans-serif;color:#896b74;line-height:1.7}.message{padding:24px 18px;margin:27px 0;background:#f9eded;border-radius:20px;border:1px solid #efd9db}.message h2{font-size:24px;font-weight:400;margin:0 0 10px}.message p{font-size:16px;line-height:1.6;margin:0}.countdown{font:14px system-ui,sans-serif;color:#845766;line-height:1.8}.footer{margin-top:27px;font:12px system-ui,sans-serif;color:#a17b83}.spark{position:fixed;pointer-events:none;animation:float 7s linear forwards;color:#bb7890;opacity:.6}@keyframes float{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}@media(max-width:370px){.card{padding:28px 15px}.unit{padding:13px 2px}}
</style></head><body><main class="card"><div class="eyebrow">История одной семьи</div><h1>Андрей <span class="heart">♥</span> Лиза</h1><div class="date">21 ноября 2026 года</div><div class="line"></div><div class="intro">Сколько прекрасного времени вы уже вместе в браке</div><section class="timer" aria-label="Время со свадьбы"><div class="unit"><div class="num" id="y">0</div><div class="lbl">лет</div></div><div class="unit"><div class="num" id="m">0</div><div class="lbl">месяцев</div></div><div class="unit"><div class="num" id="d">0</div><div class="lbl">дней</div></div></section><div class="small" id="extra"></div><section class="message"><h2 id="msgTitle">Всё только начинается ♥</h2><p id="msgBody">Пусть впереди будет много любви, смеха и общих мечтаний.</p></section><div class="countdown" id="next"></div><div class="footer">С любовью, ваш друг Глеб ♥</div></main>
<script>
const start=new Date(2026,10,21),day=86400000;
const $=id=>document.getElementById(id);
function calendarDiff(a,b){let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return [y,m,d]}
function update(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(today<start){$('msgTitle').textContent='Скоро ваша свадьба!';$('msgBody').textContent='Самая красивая история ещё впереди.';return}
let [y,m,d]=calendarDiff(start,today);$('y').textContent=y;$('m').textContent=m;$('d').textContent=d;
const elapsed=Math.round((today-start)/day),h=now.getHours(),min=now.getMinutes();$('extra').textContent='И ещё '+h+' ч '+min+' мин сегодняшнего дня';
let title='Каждый день — ещё одна страница вашей истории ♥',body='Берегите друг друга, мечтайте вместе и не забывайте смеяться.';
const month=now.getMonth(),date=now.getDate();
if(month===10&&date===21){if(y===0){title='Сегодня родилась ваша семья! 💍';body='21 ноября 2026 года — начало вашей общей истории.'}else if(y===1){title='Первая годовщина! 🥂';body='Год назад вы сказали друг другу «да». Впереди ещё столько счастливых лет!'}else if(y===5){title='Пять лет вместе! ♥';body='Первый большой юбилей. Пусть ваши мечты продолжают сбываться.'}else if(y===10){title='Десять лет со свадьбы! ✨';body='Помните наши покерные вечера? Главное, что вы всегда играете в одной команде. Обнимаю, Глеб.'}else if(y===20||y===25||y===30||y===50){title=y+' лет вашей семье! ♥';body='Сколько историй, побед и тёплых вечеров уже позади. Пусть впереди будет ещё больше!'}else{title='С годовщиной, Андрей и Лиза! 🎉';body=y+' лет вместе в браке. Пусть каждый новый год приносит вам радость и новые воспоминания.'}}
else if(month===11&&date===21&&y===0){title='Первый месяц семьи ♥';body='Уже целый месяц вы муж и жена!'}
else if(elapsed===7){title='Первая неделя! ♥';body='Семь дней семейной жизни — и целая вечность впереди.'}
else if(elapsed===100){title='100 дней вашей семье! ✨';body='Сто маленьких шагов в большом совместном путешествии.'}
else if(elapsed===500||elapsed===1000){title=elapsed+' дней вместе в браке! ♥';body='Пусть каждый из этих дней станет частью вашей любимой истории.'}
else if(month===1&&date===14){title='С Днём всех влюблённых! ♥';body='Пусть романтика остаётся с вами не только сегодня.'}
else if(month===0&&date===1){title='С Новым годом! ✨';body='Пусть этот год подарит вашей семье новые приключения и исполненные мечты.'}
$('msgTitle').textContent=title;$('msgBody').textContent=body;
let next=new Date(now.getFullYear(),10,21);if(today>=next)next=new Date(now.getFullYear()+1,10,21);
let days=Math.round((next-today)/day);$('next').textContent='До следующей годовщины: '+days+' дн. ♥';
}
update();setInterval(update,30000);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){setInterval(()=>{let e=document.createElement('span');e.className='spark';e.textContent=Math.random()>.5?'♥':'✧';e.style.left=Math.random()*100+'vw';e.style.bottom='-20px';e.style.fontSize=12+Math.random()*15+'px';document.body.append(e);setTimeout(()=>e.remove(),7100)},1700)}
</script></body></html>
